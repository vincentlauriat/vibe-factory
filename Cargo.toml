[workspace]
resolver = "2"
members = [
    "crates/vibe-core",
    "crates/vibe-providers",
    "crates/vibe-tools",
    "crates/vibe-workspace",
    "crates/vibe-agents",
    "crates/vibe-pipeline",
    "crates/vibe-plugins",
    "crates/vibe-cli",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vincentlauriat/vibe-factory"
homepage = "https://github.com/vincentlauriat/vibe-factory"
authors = ["Vincent Lauriat"]
keywords = ["ai", "agents", "automation", "developer-tools", "llm"]
categories = ["development-tools", "command-line-utilities"]

[workspace.dependencies]
vibe-core = { path = "crates/vibe-core", version = "0.2.0" }
vibe-providers = { path = "crates/vibe-providers", version = "0.2.0" }
vibe-tools = { path = "crates/vibe-tools", version = "0.2.0" }
vibe-workspace = { path = "crates/vibe-workspace", version = "0.2.0" }
vibe-agents = { path = "crates/vibe-agents", version = "0.2.0" }
vibe-pipeline = { path = "crates/vibe-pipeline", version = "0.2.0" }
vibe-plugins = { path = "crates/vibe-plugins", version = "0.2.0" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
schemars = "0.8"
glob = "0.3"
globset = "0.4"
regex = "1"
walkdir = "2"
ignore = "0.4"
similar = "2"
shell-words = "1"
indexmap = { version = "2", features = ["serde"] }
dirs = "5"
tempfile = "3"
fs4 = { version = "0.13", features = ["sync"] }
ratatui = "0.30"
axum = "0.8"
tokio-test = "0.4"
wiremock = "0.6"
pretty_assertions = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
